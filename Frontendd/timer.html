<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OceanDonate Live Timer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Kanit:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap">
    <style>
        :root { color-scheme: dark; font-family: "Kanit", "Noto Sans Thai", system-ui, sans-serif; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
        body { display: grid; place-items: center; }
        body[data-position="left"] { justify-items: start; padding-left: 8vw; }
        body[data-position="right"] { justify-items: end; padding-right: 8vw; }
        #timer { color: var(--timer-color, #22c55e); font-family: var(--timer-font, "Kanit", sans-serif); font-size: clamp(3rem, 18vw, 12rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .04em; text-shadow: 0 3px 24px rgba(4,47,46,.6), 0 0 10px var(--timer-color, #22c55e); }
        #timer[data-stopped="true"] { opacity: .78; }
        #timer.timer-pulse { animation: timerPulse 2s ease-in-out infinite; }
        #message { color: #fff; text-align: center; font: 700 clamp(.9rem, 3vw, 1.4rem) "Kanit", sans-serif; text-shadow: 0 2px 8px #000; }
        @keyframes timerPulse { 50% { filter: brightness(1.3); text-shadow: 0 0 28px var(--timer-color, #22c55e); } }
        #status { position: fixed; bottom: 8%; color: #cbd5e1; font-size: clamp(.9rem, 3vw, 1.4rem); }
        #status:empty { display: none; }
        @media (prefers-reduced-motion: no-preference) { #timer { transition: color .25s ease; } }
        @media (prefers-reduced-motion: reduce) { #timer { animation: none !important; transition: none !important; } }
    </style>
</head>
<body data-position="center">
    <output id="timer" role="timer" aria-label="เวลาไลฟ์คงเหลือ" data-stopped="true">00:00:00</output>
    <div id="message">โดเนทเพื่อเพิ่มเวลา!</div>
    <div id="status" role="status" aria-live="polite">เชื่อมต่อ Widget เพื่อรับเวลาไลฟ์</div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const widgetToken = new URLSearchParams(location.search).get('token');
        const statusEl = document.getElementById('status');
        const timerEl = document.getElementById('timer');
        const socket = io();
        let state = { isRunning: false, endsAt: null, remainingSeconds: 0 };
        function render() {
            const remaining = state.isRunning && state.endsAt
                ? Math.max(0, Math.ceil((Date.parse(state.endsAt) - Date.now()) / 1000))
                : Math.max(0, Number(state.remainingSeconds) || 0);
            const hours = Math.floor(remaining / 3600);
            const minutes = Math.floor(remaining % 3600 / 60);
            const seconds = remaining % 60;
            timerEl.textContent = [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
            timerEl.dataset.stopped = String(!state.isRunning || remaining === 0);
            if (state.isRunning && remaining === 0) {
                state.isRunning = false;
                statusEl.textContent = 'หมดเวลา';
            }
        }
        socket.on('connect', () => {
            if (!widgetToken) { statusEl.textContent = 'ลิงก์ Timer ไม่มี Widget token'; return; }
            socket.emit('join_widget', { token: widgetToken, kind: 'timer' });
            statusEl.textContent = 'กำลังเชื่อมต่อ';
        });
        socket.on('auth_error', error => { statusEl.textContent = error?.message || 'Widget token ไม่ถูกต้อง'; });
        socket.on('apply_timer', incoming => {
            state = { ...state, ...incoming };
            const appearance = incoming?.appearance || {};
            const allowedFonts = new Set(["'Kanit', sans-serif", "'Prompt', sans-serif", "'IBM Plex Sans Thai', sans-serif"]);
            document.body.dataset.position = ['left', 'center', 'right'].includes(appearance.position) ? appearance.position : 'center';
            timerEl.style.setProperty('--timer-color', /^#[0-9a-f]{6}$/i.test(appearance.color || '') ? appearance.color : '#22c55e');
            timerEl.style.setProperty('--timer-font', allowedFonts.has(appearance.font) ? appearance.font : "'Kanit', sans-serif");
            timerEl.classList.toggle('timer-pulse', appearance.animation === 'pulse');
            document.getElementById('message').textContent = typeof appearance.message === 'string' ? appearance.message.slice(0, 200) : 'โดเนทเพื่อเพิ่มเวลา!';
            document.getElementById('message').style.fontFamily = allowedFonts.has(appearance.font) ? appearance.font : "'Kanit', sans-serif";
            render(); statusEl.textContent = state.isRunning ? '' : 'หยุดอยู่';
        });
        socket.on('disconnect', () => { statusEl.textContent = 'กำลังเชื่อมต่อใหม่'; });
        setInterval(render, 250);
    </script>
</body>
</html>
