<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Donate Alert Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Kanit:wght@400;600;700&family=Mitr:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Kanit', sans-serif; 
            background: transparent; 
        }

        #alert-box { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            opacity: 0; 
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            max-width: 90vw;
            pointer-events: none;
        }
        
        /* 🟢 Layout แบบ Row ที่ถูกต้อง: ซ้ายเป็นรูป ขวาเป็นกล่องข้อความซ้อนกัน 2 บรรทัด */
        #alert-box.layout-row { 
            flex-direction: row; 
            align-items: center; 
            text-align: left; 
            gap: 25px; 
            background: rgba(5, 8, 17, 0.75);
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        #alert-box.layout-row .image-box img { 
            width: 120px; 
            height: 120px; 
            margin-bottom: 0; 
        }
        #alert-box.layout-row .alert-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        #alert-box.alert-theme-neon { padding: 18px 24px; border: 2px solid #a855f7; border-radius: 10px; background: rgba(25,10,40,.86); box-shadow: 0 0 22px rgba(168,85,247,.55); }
        #alert-box.alert-theme-pink-love { padding: 18px 24px; border: 2px solid #fb7185; border-radius: 22px; background: rgba(55,10,35,.88); box-shadow: 0 0 20px rgba(251,113,133,.36); }
        #alert-box.alert-theme-glass { padding: 18px 24px; border: 1px solid rgba(255,255,255,.38); border-radius: 18px; background: rgba(25,30,45,.55); backdrop-filter: blur(10px); }
        #alert-box.alert-theme-gold { padding: 18px 24px; border: 2px solid #eab308; border-radius: 12px; background: rgba(40,28,5,.86); box-shadow: 0 0 20px rgba(234,179,8,.35); }
        #alert-box.alert-theme-minecraft { padding: 16px 20px; border: 3px solid #4ade80; border-radius: 2px; background: rgba(15,45,25,.9); }

        @keyframes popIn { 
            0% { transform: translate(-50%, -40%) scale(0.8); opacity: 0; } 
            50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
        }
        .show-alert { 
            animation: popIn 0.6s forwards !important; 
            opacity: 1 !important; 
        }

        .image-box img { 
            width: 160px; 
            height: 160px; 
            border-radius: 18px; 
            object-fit: cover; 
            box-shadow: 0 12px 25px rgba(0,0,0,0.6); 
            margin-bottom: 15px; 
            transition: 0.3s; 
            border: 2px solid rgba(255,255,255,0.2);
        }
        .alert-text-wrapper {
            max-width: 600px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .text-main { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: white; 
            text-shadow: 0 3px 8px rgba(0,0,0,0.9); 
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .text-msg { 
            font-size: 1.5rem; 
            color: #f1f5f9; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); 
            line-height: 1.4;
            max-height: 150px;
            overflow: hidden;
        }
        #gift-effect { display: none; min-width: 180px; padding: 9px 22px; color: #fff; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.1; margin-bottom: 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: radial-gradient(ellipse at center,rgba(96,165,250,.32),rgba(79,70,229,.18) 62%,rgba(15,23,42,.72)); box-shadow: 0 0 26px rgba(96,165,250,.36),inset 0 0 16px rgba(255,255,255,.1); text-shadow: 0 3px 12px rgba(0,0,0,.7); }
        #gift-effect.gift-sparkle { animation: giftSparkle 1.25s ease-out both; }
        #gift-effect.gift-burst { animation: giftBurst 1.15s ease-out both; }
        #gift-effect.gift-coins { animation: giftCoins 1.2s ease-out both; }
        #gift-effect.gift-heart { animation: giftHeart 1.15s ease-out both; }
        #gift-effect.gift-confetti { animation: giftConfetti 1.2s ease-out both; }
        #gift-effect.gift-firework { animation: giftFirework 1.3s ease-out both; }
        #gift-effect.gift-shine { animation: giftShine 1.3s ease-in-out both; }
        #gift-effect.gift-shake { animation: giftShake .7s ease-in-out both; }
        #gift-effect.gift-burst, #gift-effect.gift-firework { box-shadow: 0 0 36px rgba(251,191,36,.55),inset 0 0 22px rgba(251,191,36,.18); }
        #gift-effect.gift-heart { box-shadow: 0 0 34px rgba(244,114,182,.48),inset 0 0 20px rgba(244,114,182,.16); }
        @keyframes giftSparkle { 0% { opacity: 0; transform: scale(.35) rotate(-30deg); } 55% { opacity: 1; transform: scale(1.25) rotate(12deg); } 100% { transform: scale(1); } }
        @keyframes giftBurst { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.4); } 100% { transform: scale(1); } }
        @keyframes giftCoins { 0% { opacity: 0; transform: translateY(18px) rotate(-10deg); } 70% { opacity: 1; transform: translateY(-8px) rotate(8deg); } 100% { transform: translateY(0); } }
        @keyframes giftHeart { 0% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes giftConfetti { 0% { opacity: 0; transform: translateY(-15px) rotate(-12deg) scale(.7); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
        @keyframes giftFirework { 0% { opacity: 0; transform: scale(.2); filter: brightness(2); } 55% { opacity: 1; transform: scale(1.35); } 100% { transform: scale(1); filter: brightness(1); } }
        @keyframes giftShine { 0% { opacity: 0; filter: brightness(.5); } 50% { opacity: 1; filter: brightness(2); } 100% { filter: brightness(1); } }
        @keyframes giftShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-4deg); } 75% { transform: translateX(8px) rotate(4deg); } }
        @media (prefers-reduced-motion: reduce) { #gift-effect, #alert-box { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <div id="alert-box">
        <div id="gift-effect" aria-live="polite"></div>
        <div class="image-box">
            <img id="alert-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWp1YzJxajRrMjlhdDZmaXdkcHRkMnphM2I5ODJhZmlyOWVvYm45ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/YaP3iYxN3T8nIEN5rD/giphy.gif" alt="img">
        </div>
        <div class="alert-text-wrapper">
            <div class="text-main">
                <span id="donator-name">Name</span> 
                <span id="text-donate">โดเนทมา</span> 
                <span id="donate-amount">0 บาท</span>
            </div>
            <div class="text-msg" id="donate-message">Message here</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const widgetToken = urlParams.get('token');
        const targetUser = urlParams.get('u') || 'OceanDIWa';
        
        const socket = io(); 

        let activeSettings = {
            layout: 'main',
            sound: 'boing',
            soundVol: 75,
            ttsRate: 1.0,
            ttsPitch: 1.0,
            ttsVol: 100,
            ttsNameToggle: true,
            ttsMsgToggle: true,
            imgUrl: 'https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWp1YzJxajRrMjlhdDZmaXdkcHRkMnphM2I5ODJhZmlyOWVvYm45ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/YaP3iYxN3T8nIEN5rD/giphy.gif',
            nameColor: '#f59e0b',
            amountColor: '#5BC0EB',
            textColor: '#ffffff',
            font: "'Kanit', sans-serif",
            alertTheme: 'default'
        };

        socket.on('connect', () => {
            console.log("Connected to OceanDonate Widget Socket");
            socket.emit('join_widget', { token: widgetToken, username: targetUser, kind: 'alert' });
        });
        
        let alertQueue = [];
        let isAlertActive = false; 
        let activeQueueId = null;
        let finishCurrentAlert = null;

        socket.on('stop_alert', ({ queueId } = {}) => {
            if (activeQueueId !== queueId || typeof finishCurrentAlert !== 'function') return;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            finishCurrentAlert();
        });

        // 🟢 ระบบสร้างเสียงแจ้งเตือนแบบ Web Audio API (เล่นได้ 100% ไม่พึ่งพาเซิร์ฟเวอร์ภายนอก)
        function playSynthesizedSound(type, volumeRatio) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime((volumeRatio || 0.75) * 0.3, now);
                gain.connect(ctx.destination);

                if (type === 'success' || type === 'coin') {
                    // เสียงเหรียญ Coin Drop ติ๊งๆ 2 จังหวะ
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    osc1.type = 'sine';
                    osc2.type = 'triangle';
                    osc1.frequency.setValueAtTime(987.77, now); // B5
                    osc1.frequency.setValueAtTime(1318.51, now + 0.1); // E6
                    osc1.connect(gain);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc1.start(now);
                    osc1.stop(now + 0.6);
                } else {
                    // เสียง Boing / BB Spirit ตึ๋ง!
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(320, now + 0.35);
                    osc.connect(gain);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (err) {
                console.warn("Synthesized audio error:", err);
            }
        }

        socket.on('apply_settings', (settings) => {
            if (!settings) return;
            activeSettings = { ...activeSettings, ...settings };

            const imgEl = document.getElementById('alert-img');
            if (imgEl && activeSettings.imgUrl) {
                imgEl.src = activeSettings.imgUrl;
            }
            
            const nameEl = document.getElementById('donator-name');
            const amountEl = document.getElementById('donate-amount');
            const textDonateEl = document.getElementById('text-donate');
            const messageEl = document.getElementById('donate-message');
            
            if (nameEl) nameEl.style.color = activeSettings.nameColor || '#f59e0b';
            if (amountEl) amountEl.style.color = activeSettings.amountColor || '#5BC0EB';
            if (textDonateEl) textDonateEl.style.color = activeSettings.textColor || '#ffffff';
            if (messageEl) messageEl.style.color = activeSettings.textColor || '#f1f5f9';

            const alertBox = document.getElementById('alert-box');
            if (alertBox) {
                if (activeSettings.layout === 'row') {
                    alertBox.classList.add('layout-row');
                } else {
                    alertBox.classList.remove('layout-row');
                }
                if (activeSettings.font) {
                    alertBox.style.fontFamily = activeSettings.font;
                }
                alertBox.classList.remove('alert-theme-default', 'alert-theme-minecraft', 'alert-theme-pink-love', 'alert-theme-neon', 'alert-theme-glass', 'alert-theme-gold');
                const themes = new Set(['default', 'minecraft', 'pink-love', 'neon', 'glass', 'gold']);
                const theme = themes.has(activeSettings.alertTheme) ? activeSettings.alertTheme : 'default';
                if (theme !== 'default') alertBox.classList.add(`alert-theme-${theme}`);
            }
        });

        socket.on('show_alert', (data) => {
            alertQueue.push(data); 
            if (!isAlertActive) {
                processNextAlert(); 
            }
        });

        // 🟢 ระบบรันคิวแจ้งเตือนแบบ State Machine (ป้องกันเสียงซ้อน & ไม่ค้าง 100%)
        function processNextAlert() {
            if (alertQueue.length === 0) { 
                isAlertActive = false; 
                return; 
            }
            isAlertActive = true; 
            const data = alertQueue.shift(); 
            activeQueueId = data.queueId || null;

            const donatorName = data.name || 'ผู้ไม่ประสงค์ออกนาม';
            const donateAmount = (data.amount || 0).toLocaleString();
            const donateMessage = data.message || '';
            const giftEl = document.getElementById('gift-effect');
            const iconById = { wave: '🌊', gift: '🎁', star: '⭐', gem: '💎', dolphin: '🐬', jellyfish: '🪼', flower: '🌸', balloon: '🎈', cake: '🎂', rocket: '🚀', crown: '👑', firework: '🎆' };
            const allowedEffects = new Set(['sparkle', 'burst', 'coins', 'heart', 'confetti', 'firework', 'shine', 'shake']);
            if (giftEl && data.giftSnapshot) {
                giftEl.textContent = `${iconById[data.giftSnapshot.iconId] || '🎁'} ${data.giftSnapshot.name || 'ของขวัญ'}`;
                const effectClass = `gift-${allowedEffects.has(data.giftSnapshot.effectId) ? data.giftSnapshot.effectId : 'sparkle'}`;
                giftEl.className = '';
                giftEl.style.display = 'block';
                void giftEl.offsetWidth;
                giftEl.classList.add(effectClass);
            } else if (giftEl) {
                giftEl.textContent = '';
                giftEl.className = '';
                giftEl.style.display = 'none';
            }

            document.getElementById('donator-name').innerText = donatorName;
            document.getElementById('donate-amount').innerText = donateAmount + ' บาท';
            document.getElementById('donate-message').innerText = donateMessage;

            // 🟢 ฟีเจอร์: แสดงรูปภาพ/GIF ที่ผู้โดเนทแนบมา (ถ้ามี)
            const imgEl = document.getElementById('alert-img');
            if (data.imageUrl && data.imageUrl.trim() !== '') {
                imgEl.src = data.imageUrl.trim();
            } else {
                imgEl.src = activeSettings.imgUrl || 'https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWp1YzJxajRrMjlhdDZmaXdkcHRkMnphM2I5ODJhZmlyOWVvYm45ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/YaP3iYxN3T8nIEN5rD/giphy.gif';
            }

            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('show-alert');
            alertBox.style.opacity = '0';
            void alertBox.offsetWidth; // Trigger reflow
            alertBox.classList.add('show-alert');

            // 1. เล่นเสียงแจ้งเตือน
            const soundVol = (activeSettings.soundVol !== undefined ? activeSettings.soundVol : 75) / 100;
            playSynthesizedSound(activeSettings.sound || 'boing', soundVol);

            let finished = false;
            function finishAlert() {
                if (finished) return;
                finished = true;
                finishCurrentAlert = null;

                // คืนค่ารูปเดิม
                if (imgEl && activeSettings.imgUrl) {
                    imgEl.src = activeSettings.imgUrl;
                }
                if (giftEl) { giftEl.style.display = 'none'; giftEl.textContent = ''; giftEl.className = ''; }

                alertBox.style.opacity = '0'; 
                alertBox.classList.remove('show-alert'); 
                if (data.queueId) socket.emit('alert_finished', { queueId: data.queueId });
                activeQueueId = null;
                setTimeout(processNextAlert, 400); 
            }
            finishCurrentAlert = finishAlert;

            // 2. เล่นเสียงอ่านออกเสียง TTS หลังเสียงเตือน 300ms
            setTimeout(() => {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel(); // ตัดเสียงเก่าที่อาจค้างออก

                    let ttsText = '';
                    const speakName = (activeSettings.ttsNameToggle !== false);
                    const speakMsg = (activeSettings.ttsMsgToggle !== false);

                    if (speakName && speakMsg && donateMessage) {
                        ttsText = `${donatorName} โดเนทมา ${donateAmount} บาท บอกว่า ${donateMessage}`;
                    } else if (speakName) {
                        ttsText = `${donatorName} โดเนทมา ${donateAmount} บาท`;
                    } else if (speakMsg && donateMessage) {
                        ttsText = donateMessage;
                    }

                    if (ttsText.trim() !== '') {
                        const utterance = new SpeechSynthesisUtterance(ttsText);
                        utterance.lang = 'th-TH';
                        utterance.rate = parseFloat(activeSettings.ttsRate) || 1.0;
                        utterance.pitch = parseFloat(activeSettings.ttsPitch) || 1.0;
                        utterance.volume = (activeSettings.ttsVol !== undefined ? activeSettings.ttsVol : 100) / 100;

                        // เลือกว่าถ้ามีเสียงไทย ให้ใช้เสียงไทย
                        const voices = window.speechSynthesis.getVoices();
                        const thVoice = voices.find(v => v.lang.includes('th') || v.lang.includes('TH'));
                        if (thVoice) utterance.voice = thVoice;

                        utterance.onend = () => {
                            setTimeout(finishAlert, 1500); // รออีก 1.5 วินาทีหลังพูดจบแล้วค่อยปิด
                        };
                        utterance.onerror = () => {
                            setTimeout(finishAlert, 2000);
                        };

                        window.speechSynthesis.speak(utterance);

                        // Safety Timeout: กันกรณี TTS ใน OBS ค้าง ให้ปิดคิวไม่เกินความยาวข้อความ
                        const maxWaitTime = Math.max(5000, 3000 + ttsText.length * 120);
                        setTimeout(finishAlert, maxWaitTime);
                    } else {
                        setTimeout(finishAlert, 4000);
                    }
                } else {
                    setTimeout(finishAlert, 4500);
                }
            }, 400);
        }
    </script>
</body>
</html>
